<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
</head>
<body>

<h1>Expense Tracker</h1>

<h3>Add Expense</h3>
<input id="amount" placeholder="Amount"><br><br>
<input id="category" placeholder="Category"><br><br>
<input id="date" type="date"><br><br>
<button onclick="addExpense()">Add Expense</button>

<p id="response"></p>

<hr>

<h3>All Expenses</h3>
<button onclick="loadExpenses()">Load Expenses</button>
<ul id="expenseList"></ul>

<hr>

<h3>Summary</h3>
<button onclick="loadSummary()">Load Summary</button>
<pre id="summary"></pre>

<hr>

<h3>Insights</h3>
<button onclick="loadInsights()">Load Insights</button>
<p id="insights"></p>
<hr>

<h3>Prediction</h3>
<button onclick="loadPrediction()">Predict Next Expense</button>

<p id="prediction"></p>

<script>
function addExpense() {
    fetch("/expense", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            amount: document.getElementById("amount").value,
            category: document.getElementById("category").value,
            date: document.getElementById("date").value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("response").innerText = data.message || data.error;
    });
}
function loadPrediction() {
    fetch("/predict")
    .then(res => res.json())
    .then(data => {
        document.getElementById("prediction").innerText =
            "Next expense might be around ₹" + data.prediction;
    });
}

function loadExpenses() {
    fetch("/expense")
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById("expenseList");
        list.innerHTML = "";
        data.expenses.forEach(e => {
            let li = document.createElement("li");
            li.innerText = e.category + " - " + e.amount + " (" + e.date + ")";
            list.appendChild(li);
        });
    });
}

function loadSummary() {
    fetch("/summary")
    .then(res => res.json())
    .then(data => {
        let text = "Total: " + data.total + "\n";
        for (let c in data.category_data) {
            text += c + ": " + data.category_data[c] + "\n";
        }
        document.getElementById("summary").innerText = text;
    });
}

function loadInsights() {
    fetch("/insights")
    .then(res => res.json())
    .then(data => {
        document.getElementById("insights").innerText = data.message;
    });
}
</script>

</body>
</html>
